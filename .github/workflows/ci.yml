name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # rustup is on the runner; rust-toolchain.toml picks the version and components.
      - run: rustup show active-toolchain || rustup toolchain install
      - run: make check
