[package]
name = "khmer-ffi"
description = "Kotlin and Swift bindings for khmer-core, made by UniFFI."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "khmer_ffi"
# cdylib for Android, staticlib for iOS, lib for the tests.
crate-type = ["cdylib", "staticlib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
# The binding generator, only needed on the build machine.
bindgen = ["uniffi/cli"]

[dependencies]
khmer-core = { path = "../core" }
uniffi = "0.32.2"

# The workspace's lints, except that it forbids unsafe code, which the FFI functions
# UniFFI generates need.
[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
needless_pass_by_value = "allow" # UniFFI passes arguments by value
