[package]
name = "khmer-core"
description = "Conversion between romanized Khmer and Khmer script, for the keyboards."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
fst = "0.4.7"
# pheasa's Rust normalizer, which gives the same output as the Python package the engine uses.
pheasa = { git = "https://github.com/pheasaKhmer/pheasa", rev = "7f66edf8773b268b469bd96aa4d97416a5cd284d" }
unicode-normalization = "0.1.25"
