[project]
name = "khmer-keyboard-data"
version = "0.1.0"
description = "Exports khmer-engine's index for the keyboard core."
requires-python = ">=3.11"
license = "MIT"
dependencies = ["khmer-engine>=0.1.0.dev0", "pheasa>=0.1.0"]

[dependency-groups]
dev = ["ruff>=0.16.9"]

[tool.uv]
package = false

# khmer-engine is not on PyPI, so it is pinned to a commit on its main branch.
[tool.uv.sources]
khmer-engine = { git = "https://github.com/pheasaKhmer/khmer-engine", rev = "73b5984588da5b64de65ffcef3b093fd544c30f3" }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
